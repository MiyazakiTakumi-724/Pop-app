spring.application.name=pop-server

# --- DB（PostgreSQL） ---
# パスワードなどの秘密情報はコミットしない。環境変数で渡す（docs/spec.md 10章）
#   DB_URL      … 省略すると localhost の pop データベース
#   DB_USER     … 省略すると pop
#   DB_PASSWORD … 必須（省略するとエラーで起動しない）
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/pop}
spring.datasource.username=${DB_USER:pop}
spring.datasource.password=${DB_PASSWORD}

# テーブルはエンティティに合わせて自動で作る・更新する（練習用。本番運用ならマイグレーションツールを検討）
spring.jpa.hibernate.ddl-auto=update

# --- 画像アップロードの上限（docs/api.md 実装メモ） ---
# 既定は1ファイル1MBまでなので引き上げる
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB

# 画面の描画中にDBへ問い合わせる設定を切る（起動時の警告も消える）
spring.jpa.open-in-view=false
